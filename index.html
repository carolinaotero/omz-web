
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>OMZ Abogados Web</title>
      <!-- Favicon principal (ICO) para compatibilidad con navegadores antiguos -->
<link rel="icon" href="/favicon.ico" sizes="any" />

<!-- Favicon PNG para navegadores modernos (recomendado) -->
<link rel="icon" type="image/png" href="/favicon.png" />

<!-- Icono para accesos directos en dispositivos Apple (iPhone/iPad) -->
<link rel="apple-touch-icon" href="/favicon.png" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <!-- Formulario oculto para Netlify Forms -->
      <form name="contact" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="nombre" />
        <input type="text" name="apellido" />
        <input type="email" name="email" />
        <textarea name="mensaje"></textarea>
      </form>
    </body>
  </html>
